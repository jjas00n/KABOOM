<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KABOOM</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        width: min(360px, 80vw);
        padding: 12px 16px;
        border-radius: 8px;
        background: rgb(0 0 0 / 0.6);
        color: #eee;
        font:
          13px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .loading[hidden] {
        display: block;
        opacity: 0;
      }
      .loading-bar {
        height: 4px;
        margin-top: 8px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.2);
        overflow: hidden;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        font:
          14px/1.4 system-ui,
          sans-serif;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.8);
      }
      .hud [hidden] {
        display: none !important;
      }
      .hud-hint {
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.45);
        white-space: nowrap;
      }
      .hud-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border: 2px solid rgb(255 255 255 / 0.85);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.4);
      }
      .hud-crosshair::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: #fff;
      }
      .hud-power {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        width: min(320px, 70vw);
        text-align: center;
      }
      .hud-power-bar {
        height: 10px;
        margin-top: 4px;
        border-radius: 5px;
        background: rgb(0 0 0 / 0.5);
        overflow: hidden;
      }
      .hud-power-fill {
        height: 100%;
        background: linear-gradient(90deg, #f2c94c, #eb5757);
      }
      .hud-buttons {
        position: absolute;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
      }
      .hud-button {
        pointer-events: auto;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: rgb(30 30 34 / 0.85);
        color: #fff;
        font:
          600 15px/1 system-ui,
          sans-serif;
        cursor: pointer;
      }
      .hud-button-primary {
        background: #d8b03a;
        color: #1b1b1f;
      }
      .hud-button-fire {
        background: #e0622c;
        color: #fff;
      }
      .graph-legend {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgb(20 20 24 / 0.8);
        color: #e8e8e8;
        font:
          12px/1.6 system-ui,
          sans-serif;
        pointer-events: none;
      }
      .graph-legend span {
        display: inline-block;
        width: 18px;
        height: 4px;
        margin-right: 8px;
        vertical-align: middle;
        border-radius: 2px;
      }
      .hud-button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .loading-bar > div {
        height: 100%;
        width: 0;
        background: #e8a33c;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
