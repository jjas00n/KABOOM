<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KABOOM</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        width: min(360px, 80vw);
        padding: 12px 16px;
        border-radius: 8px;
        background: rgb(0 0 0 / 0.6);
        color: #eee;
        font:
          13px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .loading[hidden] {
        display: block;
        opacity: 0;
      }
      .loading-bar {
        height: 4px;
        margin-top: 8px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.2);
        overflow: hidden;
      }
      .loading-bar > div {
        height: 100%;
        width: 0;
        background: #e8a33c;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
