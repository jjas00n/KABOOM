<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KABOOM</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        width: min(360px, 80vw);
        padding: 12px 16px;
        border-radius: 8px;
        background: rgb(0 0 0 / 0.6);
        color: #eee;
        font:
          13px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .loading[hidden] {
        display: block;
        opacity: 0;
      }
      .loading-bar {
        height: 4px;
        margin-top: 8px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.2);
        overflow: hidden;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        font:
          14px/1.4 system-ui,
          sans-serif;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.8);
      }
      .hud [hidden] {
        display: none !important;
      }
      .hud-hint {
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.45);
        white-space: nowrap;
      }
      .hud-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border: 2px solid rgb(255 255 255 / 0.85);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.4);
      }
      .hud-crosshair::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: #fff;
      }
      .hud-power {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        width: min(320px, 70vw);
        text-align: center;
      }
      .hud-power-bar {
        height: 10px;
        margin-top: 4px;
        border-radius: 5px;
        background: rgb(0 0 0 / 0.5);
        overflow: hidden;
      }
      .hud-power-fill {
        height: 100%;
        background: linear-gradient(90deg, #f2c94c, #eb5757);
      }
      .hud-buttons {
        position: absolute;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
      }
      .hud-button {
        pointer-events: auto;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: rgb(30 30 34 / 0.85);
        color: #fff;
        font:
          600 15px/1 system-ui,
          sans-serif;
        cursor: pointer;
      }
      .hud-button-primary {
        background: #d8b03a;
        color: #1b1b1f;
      }
      .hud-button-fire {
        background: #e0622c;
        color: #fff;
      }
      .eco-hud {
        position: fixed;
        left: 16px;
        top: 16px;
        min-width: 220px;
        padding: 10px 14px 12px;
        border-radius: 10px;
        background: rgb(20 20 24 / 0.72);
        color: #f2f2f2;
        font:
          600 13px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
      }
      .eco-money {
        font-size: 28px;
        font-weight: 800;
        color: #ffd25a;
        font-variant-numeric: tabular-nums;
        transition: transform 0.15s;
      }
      .eco-money.rolling {
        transform: scale(1.06);
      }
      .eco-building {
        opacity: 0.8;
        font-variant-numeric: tabular-nums;
      }
      .eco-bar {
        position: relative;
        height: 8px;
        margin-top: 8px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.15);
      }
      .eco-bar-fill {
        height: 100%;
        width: 0;
        border-radius: 4px;
        background: linear-gradient(90deg, #8a8f99, #e0622c);
        transition: width 0.2s;
      }
      .eco-bar-fill.done {
        background: linear-gradient(90deg, #e0622c, #ffd25a);
      }
      .eco-bar-mark {
        position: absolute;
        top: -3px;
        width: 2px;
        height: 14px;
        background: #fff;
      }
      .eco-bar-label {
        margin-top: 4px;
        font-size: 12px;
        opacity: 0.8;
      }
      .money-popups {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .money-popup {
        position: absolute;
        left: 0;
        top: 0;
        color: #ffe9a8;
        font:
          800 18px/1 system-ui,
          sans-serif;
        text-shadow: 0 2px 6px rgb(0 0 0 / 0.7);
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .money-popup.big {
        color: #ffcf3a;
        text-shadow:
          0 0 12px rgb(255 190 40 / 0.8),
          0 2px 6px rgb(0 0 0 / 0.8);
      }
      .money-popup.rare {
        color: #fff6c8;
        text-shadow:
          0 0 16px rgb(255 230 120 / 1),
          0 0 4px rgb(255 255 255 / 1);
      }
      .money-big {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        color: #ffd25a;
        font:
          900 64px/1 system-ui,
          sans-serif;
        text-align: center;
        -webkit-text-stroke: 2px #6b3a00;
        text-shadow: 0 3px 0 rgb(0 0 0 / 0.6);
        opacity: 0;
      }
      .money-big-label {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 700;
        color: #fff2c8;
      }
      .finale-banner {
        position: fixed;
        left: 50%;
        top: 22%;
        transform: translate(-50%, -50%);
        color: #fff;
        font:
          900 88px/1 system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        -webkit-text-stroke: 3px #c2410c;
        text-shadow: 0 4px 0 rgb(0 0 0 / 0.6);
        pointer-events: none;
        opacity: 0;
      }
      .result {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        min-width: 360px;
        padding: 22px 26px 20px;
        border-radius: 14px;
        background: rgb(20 20 24 / 0.9);
        color: #f2f2f2;
        font:
          600 15px/1.5 system-ui,
          sans-serif;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
      }
      .result-title {
        margin-bottom: 12px;
        font-size: 22px;
        font-weight: 800;
        color: #ffd25a;
      }
      .result-row {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        font-variant-numeric: tabular-nums;
      }
      .result-row.total {
        margin: 4px 0 8px;
        padding-top: 6px;
        border-top: 1px solid rgb(255 255 255 / 0.2);
        font-size: 18px;
        font-weight: 800;
        color: #ffd25a;
      }
      .result-next {
        margin-top: 16px;
        width: 100%;
      }
      .graph-legend {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgb(20 20 24 / 0.8);
        color: #e8e8e8;
        font:
          12px/1.6 system-ui,
          sans-serif;
        pointer-events: none;
      }
      .graph-legend span {
        display: inline-block;
        width: 18px;
        height: 4px;
        margin-right: 8px;
        vertical-align: middle;
        border-radius: 2px;
      }
      .hud-button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .loading-bar > div {
        height: 100%;
        width: 0;
        background: #e8a33c;
      }
      .hud-button-abandon.confirm {
        background: #b42318;
        color: #fff;
      }
      .board {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(960px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 20px 22px;
        border-radius: 14px;
        background: rgb(20 20 24 / 0.9);
        color: #f2f2f2;
        font:
          500 14px/1.5 system-ui,
          sans-serif;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
      }
      .board-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .board-title {
        font-size: 22px;
        font-weight: 800;
        color: #ffd25a;
      }
      .board-quality select {
        margin-left: 6px;
        font: inherit;
      }
      .board-summary {
        margin: 4px 0 14px;
        color: #c8c8c8;
        font-variant-numeric: tabular-nums;
      }
      .board-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }
      .board-card {
        display: flex;
        flex-direction: column;
        padding: 12px;
        border-radius: 10px;
        background: rgb(255 255 255 / 0.06);
        border-top: 3px solid #8fa3b0;
      }
      .board-card.tier-medium {
        border-top-color: #e8a33c;
      }
      .board-card.tier-large {
        border-top-color: #e5484d;
      }
      .board-thumb {
        width: 100%;
        aspect-ratio: 256 / 160;
        border-radius: 6px;
        background: #2a2d33;
      }
      .board-name {
        margin-top: 8px;
        font-size: 17px;
        font-weight: 800;
      }
      .board-client {
        color: #a8a8a8;
        font-size: 12px;
      }
      .board-tags {
        margin: 6px 0 2px;
      }
      .board-tag {
        display: inline-block;
        margin-right: 6px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: rgb(255 255 255 / 0.12);
      }
      .board-tag.trait {
        background: #3b4a6b;
      }
      .board-trait {
        color: #c8c8c8;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .board-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-variant-numeric: tabular-nums;
      }
      .board-row span:first-child {
        color: #a8a8a8;
      }
      .board-take {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
